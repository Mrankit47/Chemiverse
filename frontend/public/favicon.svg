<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="favBgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0f1b3b" />
      <stop offset="60%" stop-color="#080e22" />
      <stop offset="100%" stop-color="#030611" />
    </radialGradient>

    <!-- Glowing Chemistry Gradients -->
    <linearGradient id="favHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00FF9C" />
    </linearGradient>

    <linearGradient id="favFlaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="40%" stop-color="#00BFFF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="favLiquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9C" />
      <stop offset="50%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#00BFFF" />
    </linearGradient>

    <!-- Liquid clip path inside flask -->
    <clipPath id="favFlaskClip">
      <path d="M 235 180 L 150 370 C 138 395 156 422 186 422 L 326 422 C 356 422 374 395 362 370 L 277 180 Z" />
    </clipPath>

    <!-- Glow Filter -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Badge -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#favBgGrad)" stroke="url(#favHexGrad)" stroke-width="8" />

  <!-- Core Ambient Glow -->
  <circle cx="256" cy="300" r="160" fill="#00F5FF" opacity="0.18" filter="url(#favGlow)" />

  <!-- Outer Hexagonal Benzene Ring / Carbon Ring -->
  <polygon
    points="256,50 435,153 435,359 256,462 77,359 77,153"
    fill="none"
    stroke="url(#favHexGrad)"
    stroke-width="14"
    stroke-linejoin="round"
    filter="url(#favGlow)"
  />

  <!-- Delocalized Aromatic Inner Ring -->
  <polygon
    points="256,85 400,168 400,344 256,427 112,344 112,168"
    fill="none"
    stroke="rgba(0, 245, 255, 0.28)"
    stroke-width="6"
    stroke-dasharray="16 12"
    stroke-linejoin="round"
  />

  <!-- Atomic Orbital Tracks -->
  <g transform="rotate(-30, 256, 280)" filter="url(#favGlow)">
    <ellipse cx="256" cy="280" rx="205" ry="75" fill="none" stroke="rgba(139, 92, 246, 0.7)" stroke-width="7" stroke-dasharray="18 12" />
    <circle cx="461" cy="280" r="15" fill="#00F5FF" />
    <circle cx="461" cy="280" r="7" fill="#FFFFFF" />
    <circle cx="51" cy="280" r="13" fill="#8B5CF6" />
    <circle cx="51" cy="280" r="6" fill="#FFFFFF" />
  </g>

  <g transform="rotate(35, 256, 280)" filter="url(#favGlow)">
    <ellipse cx="256" cy="280" rx="205" ry="75" fill="none" stroke="rgba(0, 245, 255, 0.7)" stroke-width="7" stroke-dasharray="18 12" />
    <circle cx="461" cy="280" r="15" fill="#00FF9C" />
    <circle cx="461" cy="280" r="7" fill="#FFFFFF" />
    <circle cx="51" cy="280" r="13" fill="#00BFFF" />
    <circle cx="51" cy="280" r="6" fill="#FFFFFF" />
  </g>

  <!-- Liquid inside Flask (Clipped) -->
  <g clip-path="url(#favFlaskClip)">
    <rect x="100" y="270" width="312" height="170" fill="url(#favLiquidGrad)" />
    <!-- Meniscus Wave Surface -->
    <path d="M 120 285 Q 188 265 256 285 T 392 285 L 392 430 L 120 430 Z" fill="url(#favLiquidGrad)" opacity="0.95" />
    <path d="M 130 285 Q 193 265 256 285 T 382 285" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.8" />
    <!-- Reaction Bubbles -->
    <circle cx="215" cy="360" r="12" fill="#FFFFFF" opacity="0.8" />
    <circle cx="280" cy="340" r="16" fill="#FFFFFF" opacity="0.75" />
    <circle cx="250" cy="385" r="9" fill="#FFFFFF" opacity="0.6" />
    <circle cx="310" cy="375" r="10" fill="#FFFFFF" opacity="0.7" />
    <circle cx="185" cy="335" r="8" fill="#FFFFFF" opacity="0.65" />
  </g>

  <!-- Erlenmeyer Glass Flask Contour -->
  <path
    d="M 230 115 
       L 230 175 
       L 145 365 
       C 132 392 152 425 182 425 
       L 330 425 
       C 360 425 380 392 367 365 
       L 282 175 
       L 282 115"
    fill="none"
    stroke="url(#favFlaskGrad)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#favGlow)"
  />

  <!-- Flask Rim -->
  <rect x="215" y="102" width="82" height="18" rx="9" fill="#00F5FF" filter="url(#favGlow)" />

  <!-- Measurement Graduation Marks -->
  <line x1="245" y1="245" x2="275" y2="245" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <line x1="230" y1="295" x2="270" y2="295" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <line x1="210" y1="345" x2="260" y2="345" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8" />

  <!-- Glass Reflective Sheen -->
  <path d="M 270 130 L 270 175 L 340 330" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.45" />

  <!-- Bubbles Escaping Neck -->
  <circle cx="256" cy="82" r="12" fill="#00FF9C" filter="url(#favGlow)" />
  <circle cx="245" cy="50" r="9" fill="#00F5FF" opacity="0.9" />
  <circle cx="268" cy="28" r="7" fill="#8B5CF6" opacity="0.85" />
</svg>
